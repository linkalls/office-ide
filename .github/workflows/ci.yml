name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push makes an older run obsolete. Cancelling it keeps feedback quick
# while avoiding duplicate Rust builds on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Bun / frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep local development and CI on the package-manager version declared
      # in package.json so lockfile behavior stays reproducible.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust / Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Formatting does not need native Tauri libraries, so fail fast before
      # spending time installing and compiling the desktop dependency graph.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # These are Tauri v2's documented Debian/Ubuntu prerequisites. The 4.1
      # WebKit package matches the Linux feature set used by Tauri v2.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: office-ide-ci

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
